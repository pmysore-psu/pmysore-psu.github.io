<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Study Tracker & Heatmap</title>
    <!-- Tailwind CSS for layout structure -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tabspace {
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }
        .tabspace a {
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px 4px 0 0;
            margin-right: 4px;
            display: inline-block;
        }
        .tabOn {
            background-color: cornflowerblue;
            color: linen !important;
            font-weight: bold;
        }
        .tabOff {
            background-color: rgba(100, 149, 237, 0.2);
            color: cornflowerblue;
        }
        .tabOff:hover {
            background-color: rgba(100, 149, 237, 0.4);
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // TODO: Replace with your own Firebase project configuration
        const firebaseConfig = {
        apiKey: "AIzaSyAEUndKc0W1M_SPNeIxUU65m13EKh67U3I",
        authDomain: "study-tracker-59fe0.firebaseapp.com",
        projectId: "study-tracker-59fe0",
        storageBucket: "study-tracker-59fe0.firebasestorage.app",
        messagingSenderId: "1093428015301",
        appId: "1:1093428015301:web:bce9457a6cb534177cc0ac",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.FB = { setDoc, doc, collection, getDocs };
        
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body vlink="cornflowerblue" text="cornflowerblue" link="cornflowerblue" bgcolor="linen" class="min-h-screen flex flex-col items-center p-4">

    <!-- Navigation Tabs -->
    <div class="tabspace w-full max-w-xl">
        <a class="tabOn" href="index.html">home</a>
        <a class="tabOff" href="builds.html">builds</a>
        <a class="tabOff" href="recipes.html">recipes</a>
        <a class="tabOff" href="more.html">more</a>
        <a class="tabOff" href="study.html">study</a>
        <a class="tabOff" href="index_study.html">study_timer</a>
    </div>

    <!-- Main Container -->
    <div class="max-w-xl w-full bg-[linen] border border-[cornflowerblue] rounded-2xl p-6 shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight">Study Tracker & Heatmap</h1>
            <p class="text-sm opacity-80">Track time, build consistency, sync to the cloud.</p>
        </div>

        <!-- Stopwatch Section (Simplified: No subject field) -->
        <div class="bg-[linen] p-6 rounded-xl border border-[cornflowerblue] flex flex-col items-center space-y-4 shadow-inner">
            <!-- Timer Display -->
            <div id="timerDisplay" class="text-5xl font-mono font-bold tracking-widest text-[cornflowerblue]">
                00:00:00
            </div>

            <!-- Controls -->
            <div class="flex space-x-3 w-full">
                <button id="startBtn" onclick="startTimer()" class="flex-1 bg-[cornflowerblue] text-white hover:opacity-90 font-semibold py-2 rounded-lg transition">Start</button>
                <button id="pauseBtn" onclick="pauseTimer()" class="flex-1 bg-amber-600 text-white hover:opacity-90 font-semibold py-2 rounded-lg transition" disabled>Pause</button>
                <button id="stopBtn" onclick="stopAndSaveTimer()" class="flex-1 bg-rose-600 text-white hover:opacity-90 font-semibold py-2 rounded-lg transition" disabled>Stop & Save</button>
            </div>
        </div>

        <!-- GitHub Heatmap Section -->
        <div class="bg-[linen] p-4 rounded-xl border border-[cornflowerblue] overflow-x-auto shadow-inner">
            <h2 class="text-xs font-semibold uppercase tracking-wider opacity-80 mb-3">Study Activity Heatmap</h2>
            <div id="heatmapGrid" class="grid grid-flow-col grid-rows-7 gap-1.5 min-w-[500px]">
                <!-- Heatmap cells injected dynamically via JavaScript -->
            </div>
            <div class="flex items-center justify-end space-x-2 mt-3 text-xs opacity-80">
                <span>Less</span>
                <div class="w-3 h-3 bg-gray-300 rounded-sm"></div>
                <div class="w-3 h-3 bg-blue-300 rounded-sm"></div>
                <div class="w-3 h-3 bg-blue-500 rounded-sm"></div>
                <div class="w-3 h-3 bg-[cornflowerblue] rounded-sm"></div>
                <span>More</span>
            </div>
        </div>

        <div id="syncStatus" class="text-xs text-center opacity-70">Connecting to cloud storage...</div>
    </div>

    <script>
        let secondsElapsed = 0;
        let timerInterval = null;
        let isRunning = false;
        let dailyData = {}; // Format: { "YYYY-MM-DD": totalMinutes }

        function formatTime(totalSeconds) {
            const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('stopBtn').disabled = false;

            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timerDisplay').innerText = formatTime(secondsElapsed);
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        async function stopAndSaveTimer() {
            pauseTimer();
            const minutesStudied = Math.round(secondsElapsed / 60);
            
            if (minutesStudied > 0) {
                const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
                dailyData[todayStr] = (dailyData[todayStr] || 0) + minutesStudied;
                
                renderHeatmap();
                await syncToFirebase(todayStr, dailyData[todayStr]);
            }

            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = "00:00:00";
            document.getElementById('stopBtn').disabled = true;
        }

        function renderHeatmap() {
            const grid = document.getElementById('heatmapGrid');
            grid.innerHTML = '';

            const today = new Date();
            for (let i = 119; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const minutes = dailyData[dateStr] || 0;

                const cell = document.createElement('div');
                cell.className = "w-3.5 h-3.5 rounded-sm transition-all";
                cell.title = `${dateStr}: ${minutes} mins studied`;

                if (minutes === 0) cell.classList.add('bg-gray-300');
                else if (minutes < 30) cell.classList.add('bg-blue-300');
                else if (minutes < 90) cell.classList.add('bg-blue-500');
                else cell.classList.add('bg-[cornflowerblue]');

                grid.appendChild(cell);
            }
        }

        async function syncToFirebase(dateStr, minutes) {
            const statusEl = document.getElementById('syncStatus');
            try {
                await window.FB.setDoc(window.FB.doc(window.db, "studyLogs", dateStr), {
                    minutes: minutes,
                    lastUpdated: new Date()
                }, { merge: true });
                statusEl.innerText = "Synced to cloud successfully!";
            } catch (err) {
                statusEl.innerText = "Cloud sync failed. Saved locally.";
                console.error(err);
            }
        }

        async function loadFromFirebase() {
            const statusEl = document.getElementById('syncStatus');
            try {
                const querySnapshot = await window.FB.getDocs(window.FB.collection(window.db, "studyLogs"));
                querySnapshot.forEach((doc) => {
                    dailyData[doc.id] = doc.data().minutes;
                });
                renderHeatmap();
                statusEl.innerText = "Cloud data loaded successfully!";
            } catch (err) {
                statusEl.innerText = "Failed to load cloud data.";
                console.error(err);
            }
        }

        window.addEventListener('firebase-ready', loadFromFirebase);
        renderHeatmap();
    </script>
</body>
</html>
